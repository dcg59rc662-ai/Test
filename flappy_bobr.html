h1{margin:16px 0 4px;color:#66330f;font-size:43px;line-height:1;letter-spacing:-2px}
p{margin:8px 0 20px;color:#614b3c;font-weight:650}
button{border:0;border-radius:16px;padding:15px 25px;background:#e67d21;color:#fff;font-size:17px;font-weight:950;box-shadow:0 6px 0 #a84e0e;cursor:pointer}
button:active{transform:translateY(4px);box-shadow:0 2px 0 #a84e0e}
.tip{margin-top:16px;font-size:12px;color:#806f63}
.hidden{display:none}
</style>

let W,H,dpr,state="menu",score=0,best=+localStorage.flappyBobrBest||0;
let bird={x:0,y:0,vy:0},pipes=[],last=0,timer=0;

B.textContent="BEST "+best;

function size(){
 const r=G.getBoundingClientRect(); dpr=Math.min(devicePixelRatio||1,2);
 W=r.width;H=r.height;C.width=W*dpr;C.height=H*dpr;X.setTransform(dpr,0,0,dpr,0,0);
}
addEventListener("resize",size);size();

function reset(){
 score=0;pipes=[];timer=0;bird={x:W*.28,y:H*.43,vy:0};S.textContent=0;
}
function start(){
 reset();state="playing";P.classList.add("hidden");last=performance.now();flap();requestAnimationFrame(loop);
}
function flap(){
 if(state==="menu"||state==="dead") return start();
 bird.vy=-430;
}
function pipe(){
 const gap=Math.max(145,H*.215), min=75,max=H-105-gap;
 const center=min+Math.random()*Math.max(1,max-min);
 pipes.push({x:W+30,center,gap,passed:false});
}
function gameOver(){
 if(state!=="playing")return;state="dead";
 if(score>best){best=score;localStorage.flappyBobrBest=best;B.textContent="BEST "+best}
 T.textContent="BOBR BONKED";
 M.textContent="That was impressively bad. Score: "+score;
 BTN.textContent="PLAY AGAIN";P.classList.remove("hidden");
}
function update(dt){
 bird.vy+=1120*dt;bird.y+=bird.vy*dt;
 timer+=dt;if(timer>1.45){timer=0;pipe()}
 for(const p of pipes){
   p.x-=220*dt;
   if(!p.passed&&p.x+66<bird.x){p.passed=true;score++;S.textContent=score}
   const bx=bird.x,by=bird.y,r=bird.r||25;
   const hitX=bx+r>p.x&&bx-r<p.x+66;
   const topEnd=p.center-p.gap/2,bottomStart=p.center+p.gap/2;
   if(hitX&&(by-r<topEnd||by+r>bottomStart))gameOver();
 }
 pipes=pipes.filter(p=>p.x>-90);
 if(bird.y-25<0||bird.y+25>H-38)gameOver();
}
function draw(){
 // bright sky inspired by the uploaded Bobr art
 const g=X.createLinearGradient(0,0,0,H);g.addColorStop(0,"#13c6e0");g.addColorStop(.7,"#83e8ef");g.addColorStop(1,"#d7f4d7");
 X.fillStyle=g;X.fillRect(0,0,W,H);
 // fluffy clouds
 for(let i=0;i<7;i++){let x=((i*143+40)-((state==="playing"?performance.now()/40:0))%(W+180)),y=70+(i%4)*150;
   X.fillStyle="#fff9";X.beginPath();X.arc(x,y,28,0,7);X.arc(x+27,y-10,34,0,7);X.arc(x+58,y,25,0,7);X.fill();
 }
 // pipes with cartoon wood/green styling
 for(const p of pipes){
   const top=p.center-p.gap/2,bottom=p.center+p.gap/2;
   pipeDraw(p.x,0,66,top,true);pipeDraw(p.x,bottom,66,H-38-bottom,false);
 }
 // ground
 X.fillStyle="#72bd43";X.fillRect(0,H-38,W,38);
 X.fillStyle="#b77a36";X.fillRect(0,H-28,W,28);
 // bobr
 const a=Math.max(-.55,Math.min(.75,bird.vy/650));
 X.save();X.translate(bird.x,bird.y);X.rotate(a);
 X.drawImage(bobr,-31,-31,62,62);X.restore();
}
function pipeDraw(x,y,w,h,top){
 if(h<=0)return;
 X.fillStyle="#7b481f";X.fillRect(x,y,w,h);
 X.fillStyle="#a96831";X.fillRect(x+7,y,w-14,h);
 X.fillStyle="#633516";X.fillRect(x-7,top?y+h-15:y,80,15);
 X.fillStyle="#d28b45";X.fillRect(x,y+4,w,5);
}
function loop(now){
 if(state!=="playing"){draw();return}
 const dt=Math.min(.033,(now-last)/1000);last=now;update(dt);draw();
 if(state==="playing")requestAnimationFrame(loop);else draw();
}
